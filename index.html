<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>FORTRESS LEGENDS Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:980px;margin:auto;padding:12px}h1{font-size:18px;margin:4px 0 10px}canvas{width:100%;aspect-ratio:16/9;background:#1c3042;border:2px solid #6c879e;border-radius:12px;display:block}#hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;font-weight:700}#units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{touch-action:manipulation;border:0;border-radius:12px;background:#285b80;color:white;padding:13px 6px;font-size:14px;font-weight:700}button:disabled{opacity:.4}#next{background:#28724f;margin-top:10px;width:100%;display:none}#stage{margin:4px 0 8px;font-weight:700;color:#e8d59b}#matchup{margin:10px 0;padding:10px;border:1px solid #6c879e;border-radius:10px;background:#203347;text-align:center;font-size:13px;line-height:1.7}#matchup strong{color:#e8d59b}#matchup .matchrow{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);align-items:center;gap:3px;margin-top:6px}#matchup .matchrow span{min-width:0;background:#30475a;border-radius:6px;padding:7px 2px;font-size:clamp(10px,2.8vw,13px);white-space:nowrap}#matchup .matchrow b{color:#a6e4bb;font-size:11px;white-space:nowrap}#reset{background:#495364;margin-top:10px;width:100%}#status{min-height:22px;text-align:center;color:#e8d59b;font-weight:bold}small{color:#b8c8d8}</style><main><h1>FORTRESS LEGENDS <small>｜試作版 2.1.3</small></h1><div id="stage">STAGE 1 / 3</div><div id="hud"><span id="hp">自軍 500 / 500</span><span id="mana">マナ 40 / 100</span><span id="enemy">敵軍 500 / 500</span><span id="enemyMana">敵マナ 40 / 100</span></div><canvas id="game" width="960" height="540" aria-label="拠点攻防ゲーム"></canvas><p id="status">敵の猛攻を防ぎ、拠点の防衛砲を突破しよう！</p><div id="matchup"><strong>兵種相性｜左が有利（攻撃1.5倍）</strong><div class="matchrow"><span>🛡️ ガーディアン</span><b>有利 ➜</b><span>🏹 レンジャー</span></div><div class="matchrow"><span>🏹 レンジャー</span><b>有利 ➜</b><span>⚙️ ゴーレム</span></div><div class="matchrow"><span>⚙️ ゴーレム</span><b>有利 ➜</b><span>🛡️ ガーディアン</span></div></div><div id="units"><button data-type="guard">🛡️ ガーディアン<br>20 マナ</button><button data-type="ranger">🏹 レンジャー<br>30 マナ</button><button data-type="golem">⚙️ ゴーレム<br>55 マナ</button></div><button id="next">次のステージへ進む</button><button id="reset">このステージをやり直す</button><p><small>iPhoneのSafariでプレイできます。横向き推奨。素材はCanvas図形で描画しています。</small></p></main><script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status'),hpEl=document.getElementById('hp'),manaEl=document.getElementById('mana'),enemyEl=document.getElementById('enemy'),enemyManaEl=document.getElementById('enemyMana');
const stats={
guard:{cost:20,hp:125,damage:6,range:35,speed:46,interval:.9,radius:16,kind:'guard'},
ranger:{cost:30,hp:65,damage:9,range:150,speed:39,interval:1.35,radius:13,kind:'ranger'},
golem:{cost:55,hp:260,damage:18,range:43,speed:23,interval:1.8,radius:24,kind:'golem'}};
const defs={};
for(const [type,st] of Object.entries(stats))defs[type]={...st,color:{guard:'#58c5e8',ranger:'#9fe28d',golem:'#e7b87c'}[type]};
for(const [alias,type,color] of [['foe','guard','#ef7887'],['archer','ranger','#e5a3c4'],['brute','golem','#bd6fdb']])defs[alias]={...stats[type],color};
const counter={guard:'ranger',ranger:'golem',golem:'guard'};
let units,mana,enemyMana,home,fort,elapsed,spawnTimer,ended,last,wave,turretTimer,cpuSummonCount,stage=1,unlockedStage=1;
const stageEl=document.getElementById('stage'),nextBtn=document.getElementById('next');
try{unlockedStage=Math.max(1,Math.min(3,Number(localStorage.getItem('fortressLegendsUnlockedStage'))||1))}catch(e){}
function reset(){nextBtn.style.display='none';stageEl.textContent='STAGE '+stage+' / 3';cpuSummonCount=0;units=[];mana=40;enemyMana=40;home=500;fort=500;elapsed=0;spawnTimer=1.5;turretTimer=1.8;ended=false;wave=1;last=performance.now();status.textContent='STAGE '+stage+'：両軍同じマナと兵種性能で対戦！'}
function summon(type,team){if(ended)return false;const d=defs[type];
if(team===1){if(mana<d.cost)return false;mana-=d.cost}else{if(enemyMana<d.cost)return false;enemyMana-=d.cost;cpuSummonCount++}
units.push({type,team,x:team===1?112:848,hp:d.hp,max:d.hp,damage:d.damage,attackTimer:0,id:Math.random()});return true}
function chooseEnemy(){
const allies=units.filter(u=>u.team===1&&u.hp>0),enemies=units.filter(u=>u.team===-1&&u.hp>0);
const near=allies.filter(u=>u.x>450);
const count={guard:0,ranger:0,golem:0};
for(const u of (near.length?near:allies))count[defs[u.type].kind]++;
let choice='foe';
// Stage 1 retains the tested v2.0.5 CPU strategy.
choice=cpuSummonCount%2===0?'foe':'archer';
// Stage 2 introduces an occasional golem, without changing resource rules.
if(stage===2&&cpuSummonCount%5===4&&enemyMana>=defs.brute.cost)choice='brute';
// Stage 3 reacts to the player's composition, but keeps a basic mixed formation.
if(stage===3){
if(cpuSummonCount%4===3&&enemyMana>=defs.brute.cost)choice='brute';
else if(count.golem>count.guard&&enemyMana>=defs.archer.cost)choice='archer';
else if(count.ranger>count.golem)choice='foe';
}
if(enemyMana<defs[choice].cost){
if(enemyMana>=defs.archer.cost)choice='archer';
else if(enemyMana>=defs.foe.cost)choice='foe';
else return null}
return choice}
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>summon(b.dataset.type,1)));
document.getElementById('reset').addEventListener('click',reset);
nextBtn.addEventListener('click',()=>{if(!ended||fort>0||stage>=3)return;stage++;reset()});
function update(dt){if(ended)return;elapsed+=dt;mana=Math.min(100,mana+7.2*dt);enemyMana=Math.min(100,enemyMana+7.2*dt);wave=1;spawnTimer-=dt;
if(spawnTimer<=0){
const choice=chooseEnemy();if(choice)summon(choice,-1);
spawnTimer=1.2;
}
for(const u of units){if(u.hp<=0)continue;const d=defs[u.type];u.attackTimer-=dt;let target=null,dist=Infinity;
for(const other of units){if(other.team===u.team||other.hp<=0)continue;
const dd=Math.abs(other.x-u.x);
const inFront=u.team===1?other.x>=u.x-12:other.x<=u.x+12;
if(inFront&&dd<=d.range+d.radius+defs[other.type].radius&&dd<dist){dist=dd;target=other}}
const baseX=u.team===1?866:94,baseDist=Math.abs(baseX-u.x);
if(target){
if(u.attackTimer<=0){const bonus=counter[d.kind]===defs[target.type].kind?1.5:1;target.hp-=u.damage*bonus;u.attackTimer=d.interval}
}else if(baseDist<=d.range+30){if(u.attackTimer<=0){if(u.team===1)fort-=u.damage;else home-=u.damage;u.attackTimer=d.interval}}
else{
let nextX=u.x+u.team*d.speed*dt;
// Ranged units maintain their position behind a living allied frontline unit.
// This applies symmetrically to player and CPU troops.
if(d.kind==='ranger'){
const front=units.filter(v=>v!==u&&v.team===u.team&&v.hp>0&&defs[v.type].kind!=='ranger'&&(v.x-u.x)*u.team>=-2);
if(front.length){
const nearest=front.reduce((a,b)=>(a.x-u.x)*u.team<(b.x-u.x)*u.team?a:b);
const limit=nearest.x-u.team*(d.radius+defs[nearest.type].radius+6);
if((nextX-limit)*u.team>0)nextX=limit;
}
}
u.x=Math.max(80,Math.min(880,nextX))}}
units=units.filter(u=>u.hp>0);
if(home<=0||fort<=0){ended=true;
if(fort<=0){
if(stage<3){unlockedStage=Math.max(unlockedStage,stage+1);try{localStorage.setItem('fortressLegendsUnlockedStage',String(unlockedStage))}catch(e){}nextBtn.style.display='block'}
status.textContent=stage===3?'STAGE 3 クリア！現在実装済みの全ステージを制覇！':'STAGE '+stage+' クリア！次のステージへ進めます';
}else status.textContent='STAGE '+stage+' 敗北…編成を変えて再挑戦！'}
else{status.textContent='CPUと対戦中：相手の編成を見て兵士を選ぼう'}}
function bar(x,y,w,v,max,color){ctx.fillStyle='#253344';ctx.fillRect(x,y,w,8);ctx.fillStyle=color;ctx.fillRect(x,y,w*Math.max(0,Math.min(1,v/max)),8)}
function draw(){let sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#15243e');sky.addColorStop(1,'#47716d');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);
ctx.fillStyle='#354d5a';for(let i=0;i<8;i++){let x=i*145-40;ctx.beginPath();ctx.moveTo(x,370);ctx.lineTo(x+85,195+(i%3)*40);ctx.lineTo(x+185,370);ctx.fill()}
ctx.fillStyle='#4a6456';ctx.fillRect(0,410,960,130);ctx.fillStyle='#698368';ctx.fillRect(0,405,960,15);
function castle(x,color){ctx.fillStyle=color;ctx.fillRect(x-34,285,68,125);ctx.fillRect(x-41,275,24,35);ctx.fillRect(x+17,275,24,35);ctx.fillStyle='#d9e6df';ctx.fillRect(x-9,335,18,75);ctx.fillStyle='#142c3c';ctx.fillRect(x-7,337,14,73)}
castle(55,'#52bad6');castle(905,'#d56b78');bar(12,250,88,home,500,'#65c6e2');bar(860,250,88,fort,500,'#f0808c');
for(const u of units){const d=defs[u.type];ctx.fillStyle='rgba(0,0,0,.23)';ctx.beginPath();ctx.ellipse(u.x,405,d.radius+4,7,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(u.x,390-d.radius,d.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle=u.team===1?'#123a55':'#5a2130';ctx.fillRect(u.x+(u.team===1?4:-9),385-d.radius,5,5);
if(d.kind==='golem'){ctx.strokeStyle='#fff8';ctx.lineWidth=5;ctx.strokeRect(u.x-d.radius/2,388-d.radius,d.radius,14)}
if(d.kind==='ranger'){ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(u.x+(u.team===1?9:-9),390-d.radius,9,-1.3,1.3);ctx.stroke()}
}
// Only damaged units show compact health bars; draw after sprites for visibility.
const barSlots={1:[],[-1]:[]};
for(const u of [...units].filter(u=>u.hp<u.max).sort((a,b)=>a.x-b.x)){
const d=defs[u.type],occupied=barSlots[u.team];
let slot=0;
while(occupied.some(p=>p.slot===slot&&Math.abs(p.x-u.x)<34))slot++;
occupied.push({x:u.x,slot});
const y=340-d.radius-slot*10;
ctx.fillStyle='#0c1724';ctx.fillRect(u.x-18,y-1,36,8);
bar(u.x-17,y,34,u.hp,u.max,u.team===1?'#62d7aa':'#ff9b9b');
}
if(ended){ctx.fillStyle='#0b1426bb';ctx.fillRect(250,165,460,150);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 48px system-ui';ctx.fillText(fort<=0?'VICTORY':'DEFEAT',480,252);ctx.textAlign='left'}
hpEl.textContent='自軍 '+Math.max(0,Math.ceil(home))+' / 500';enemyEl.textContent='敵軍 '+Math.max(0,Math.ceil(fort))+' / 500';manaEl.textContent='マナ '+Math.floor(mana)+' / 100';enemyManaEl.textContent='敵マナ '+Math.floor(enemyMana)+' / 100';
document.querySelectorAll('[data-type]').forEach(b=>b.disabled=ended||mana<defs[b.dataset.type].cost)}
function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop)})();
</script></html>
