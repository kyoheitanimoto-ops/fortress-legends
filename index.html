<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>FORTRESS LEGENDS Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:980px;margin:auto;padding:12px}h1{font-size:18px;margin:4px 0 10px}canvas{width:100%;aspect-ratio:16/9;background:#1c3042;border:2px solid #6c879e;border-radius:12px;display:block}#hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;font-weight:700}#units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{touch-action:manipulation;border:0;border-radius:12px;background:#285b80;color:white;padding:13px 6px;font-size:14px;font-weight:700}button:disabled{opacity:.4}#reset{background:#495364;margin-top:10px;width:100%}#status{min-height:22px;text-align:center;color:#e8d59b;font-weight:bold}small{color:#b8c8d8}</style><main><h1>FORTRESS LEGENDS <small>｜試作版 0.1</small></h1><div id="hud"><span id="hp">自軍 500 / 500</span><span id="mana">マナ 60 / 100</span><span id="enemy">敵軍 500 / 500</span></div><canvas id="game" width="960" height="540" aria-label="拠点攻防ゲーム"></canvas><p id="status">兵士を召喚して敵拠点を破壊しよう</p><div id="units"><button data-type="guard">🛡️ ガーディアン<br>20 マナ</button><button data-type="ranger">🏹 レンジャー<br>30 マナ</button><button data-type="golem">⚙️ ゴーレム<br>55 マナ</button></div><button id="reset">最初からやり直す</button><p><small>iPhoneのSafariでプレイできます。横向き推奨。素材はCanvas図形で描画しています。</small></p></main><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status'),hpEl=document.getElementById('hp'),manaEl=document.getElementById('mana'),enemyEl=document.getElementById('enemy');const defs={guard:{cost:20,hp:110,damage:13,range:35,speed:48,interval:.85,color:'#58c5e8',radius:16},ranger:{cost:30,hp:65,damage:18,range:150,speed:40,interval:1.25,color:'#9fe28d',radius:13},golem:{cost:55,hp:290,damage:35,range:43,speed:24,interval:1.7,color:'#e7b87c',radius:24},foe:{cost:0,hp:80,damage:10,range:34,speed:39,interval:1.05,color:'#ef7887',radius:15},brute:{cost:0,hp:190,damage:22,range:40,speed:25,interval:1.5,color:'#bd6fdb',radius:21}};let units,mana,home,fort,elapsed,spawnTimer,ended,last;function reset(){units=[];mana=60;home=500;fort=500;elapsed=0;spawnTimer=2;ended=false;last=performance.now();status.textContent='兵士を召喚して敵拠点を破壊しよう'}function summon(type,team){const d=defs[type];if(ended)return;if(team===1){if(mana<d.cost)return;mana-=d.cost}units.push({type,team,x:team===1?112:848,hp:d.hp,max:d.hp,attackTimer:0,id:Math.random()})}document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>summon(b.dataset.type,1)));document.getElementById('reset').addEventListener('click',reset);function update(dt){if(ended)return;elapsed+=dt;mana=Math.min(100,mana+9*dt);spawnTimer-=dt;if(spawnTimer<=0){summon(elapsed>35&&Math.random()<.28?'brute':'foe',-1);spawnTimer=Math.max(1.65,3.2-elapsed*.008)}for(const u of units){if(u.hp<=0)continue;const d=defs[u.type];u.attackTimer-=dt;let target=null,dist=Infinity;for(const other of units){if(other.team===u.team||other.hp<=0)continue;const dd=Math.abs(other.x-u.x);if(dd<dist){dist=dd;target=other}}const baseX=u.team===1?866:94,baseDist=Math.abs(baseX-u.x);const enemyAhead=target&&((u.team===1&&target.x>=u.x)||(u.team===-1&&target.x<=u.x));if(enemyAhead&&dist<=d.range+d.radius+defs[target.type].radius){if(u.attackTimer<=0){target.hp-=d.damage;u.attackTimer=d.interval}}else if(baseDist<=d.range+30){if(u.attackTimer<=0){if(u.team===1)fort-=d.damage;else home-=d.damage;u.attackTimer=d.interval}}else{u.x+=u.team*d.speed*dt;u.x=Math.max(80,Math.min(880,u.x))}}units=units.filter(u=>u.hp>0);if(home<=0||fort<=0){ended=true;status.textContent=fort<=0?'勝利！敵拠点を破壊した！':'敗北…自軍拠点が破壊された'}}function bar(x,y,w,v,max,color){ctx.fillStyle='#253344';ctx.fillRect(x,y,w,8);ctx.fillStyle=color;ctx.fillRect(x,y,w*Math.max(0,v)/max,8)}function draw(){let sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#15243e');sky.addColorStop(1,'#47716d');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);ctx.fillStyle='#354d5a';for(let i=0;i<8;i++){let x=i*145-40;ctx.beginPath();ctx.moveTo(x,370);ctx.lineTo(x+85,195+(i%3)*40);ctx.lineTo(x+185,370);ctx.fill()}ctx.fillStyle='#4a6456';ctx.fillRect(0,410,960,130);ctx.fillStyle='#698368';ctx.fillRect(0,405,960,15);function castle(x,color){ctx.fillStyle=color;ctx.fillRect(x-34,285,68,125);ctx.fillRect(x-41,275,24,35);ctx.fillRect(x+17,275,24,35);ctx.fillStyle='#d9e6df';ctx.fillRect(x-9,335,18,75);ctx.fillStyle='#142c3c';ctx.fillRect(x-7,337,14,73)}castle(55,'#52bad6');castle(905,'#d56b78');bar(12,250,88,home,500,'#65c6e2');bar(860,250,88,fort,500,'#f0808c');for(const u of units){const d=defs[u.type];ctx.fillStyle='rgba(0,0,0,.23)';ctx.beginPath();ctx.ellipse(u.x,405,d.radius+4,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(u.x,390-d.radius,d.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle=u.team===1?'#123a55':'#5a2130';ctx.fillRect(u.x+(u.team===1?4:-9),385-d.radius,5,5);if(u.type==='golem'||u.type==='brute'){ctx.strokeStyle='#fff8';ctx.lineWidth=5;ctx.strokeRect(u.x-d.radius/2,388-d.radius,d.radius,14)}bar(u.x-23,357-d.radius,46,u.hp,u.max,u.team===1?'#62d7aa':'#ff9b9b')}if(ended){ctx.fillStyle='#0b1426bb';ctx.fillRect(250,165,460,150);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 48px system-ui';ctx.fillText(fort<=0?'VICTORY':'DEFEAT',480,252);ctx.textAlign='left'}hpEl.textContent='自軍 '+Math.max(0,Math.ceil(home))+' / 500';enemyEl.textContent='敵軍 '+Math.max(0,Math.ceil(fort))+' / 500';manaEl.textContent='マナ '+Math.floor(mana)+' / 100';document.querySelectorAll('[data-type]').forEach(b=>b.disabled=ended||mana<defs[b.dataset.type].cost)}function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();
</script></html>
