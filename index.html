<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>FORTRESS LEGENDS Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:980px;margin:auto;padding:12px}h1{font-size:18px;margin:4px 0 10px}canvas{width:100%;aspect-ratio:16/9;background:#1c3042;border:2px solid #6c879e;border-radius:12px;display:block}#hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;font-weight:700}#units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{touch-action:manipulation;border:0;border-radius:12px;background:#285b80;color:white;padding:13px 6px;font-size:14px;font-weight:700}button:disabled{opacity:.4}#reset{background:#495364;margin-top:10px;width:100%}#status{min-height:22px;text-align:center;color:#e8d59b;font-weight:bold}small{color:#b8c8d8}</style><main><h1>FORTRESS LEGENDS <small>｜試作版 0.4</small></h1><div id="hud"><span id="hp">自軍 500 / 500</span><span id="mana">マナ 60 / 100</span><span id="enemy">敵軍 800 / 800</span></div><canvas id="game" width="960" height="540" aria-label="拠点攻防ゲーム"></canvas><p id="status">敵の猛攻を防ぎ、拠点の防衛砲を突破しよう！</p><div id="units"><button data-type="guard">🛡️ ガーディアン<br>20 マナ</button><button data-type="ranger">🏹 レンジャー<br>30 マナ</button><button data-type="golem">⚙️ ゴーレム<br>55 マナ</button></div><button id="reset">最初からやり直す</button><p><small>iPhoneのSafariでプレイできます。横向き推奨。素材はCanvas図形で描画しています。</small></p></main><script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status'),hpEl=document.getElementById('hp'),manaEl=document.getElementById('mana'),enemyEl=document.getElementById('enemy');
const defs={
guard:{cost:20,hp:125,damage:9,range:35,speed:46,interval:.9,color:'#58c5e8',radius:16,kind:'guard'},
ranger:{cost:30,hp:65,damage:14,range:150,speed:39,interval:1.35,color:'#9fe28d',radius:13,kind:'ranger'},
golem:{cost:55,hp:260,damage:24,range:43,speed:23,interval:1.8,color:'#e7b87c',radius:24,kind:'golem'},
foe:{cost:0,hp:105,damage:14,range:35,speed:43,interval:1.05,color:'#ef7887',radius:15,kind:'guard'},
archer:{cost:0,hp:75,damage:17,range:145,speed:37,interval:1.35,color:'#e5a3c4',radius:13,kind:'ranger'},
brute:{cost:0,hp:240,damage:28,range:43,speed:27,interval:1.65,color:'#bd6fdb',radius:21,kind:'golem'}};
const counter={guard:'ranger',ranger:'golem',golem:'guard'};
let units,mana,home,fort,elapsed,spawnTimer,ended,last,wave,turretTimer;
function reset(){units=[];mana=55;home=500;fort=800;elapsed=0;spawnTimer=.65;turretTimer=1.8;ended=false;wave=1;last=performance.now();status.textContent='敵の編成を見て兵士を選ぼう。後半は敵が強くなる！'}
function summon(type,team){if(ended)return;const d=defs[type];if(team===1){if(mana<d.cost||units.filter(u=>u.team===1).length>=14)return;mana-=d.cost}
const level=team===-1?Math.min(2.1,1+Math.floor(elapsed/22)*.16):1;
units.push({type,team,x:team===1?112:848,hp:d.hp*level,max:d.hp*level,damage:d.damage*level,attackTimer:0,id:Math.random()})}
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>summon(b.dataset.type,1)));
document.getElementById('reset').addEventListener('click',reset);
function update(dt){if(ended)return;elapsed+=dt;mana=Math.min(100,mana+7.2*dt);wave=1+Math.floor(elapsed/22);spawnTimer-=dt;turretTimer-=dt;
if(spawnTimer<=0){
const enemies=units.filter(u=>u.team===-1).length;
if(enemies<16){
let r=Math.random(),type=elapsed<8?'foe':r<.36?'foe':r<.70?'archer':'brute';
summon(type,-1);
if(elapsed>12&&Math.random()<.34&&enemies<14)summon('foe',-1);
}
spawnTimer=Math.max(.8,1.85-Math.floor(elapsed/22)*.12);
}
if(turretTimer<=0){
const attackers=units.filter(u=>u.team===1&&u.x>620&&u.hp>0);
if(attackers.length){
attackers.sort((a,b)=>b.x-a.x);
attackers[0].hp-=32;
}
turretTimer=2.1;
}
for(const u of units){if(u.hp<=0)continue;const d=defs[u.type];u.attackTimer-=dt;let target=null,dist=Infinity;
for(const other of units){if(other.team===u.team||other.hp<=0)continue;
if((u.team===1&&other.x<u.x-12)||(u.team===-1&&other.x>u.x+12))continue;
const dd=Math.abs(other.x-u.x);if(dd<dist){dist=dd;target=other}}
const baseX=u.team===1?866:94,baseDist=Math.abs(baseX-u.x);
if(target&&dist<=d.range+d.radius+defs[target.type].radius){
if(u.attackTimer<=0){const bonus=counter[d.kind]===defs[target.type].kind?1.5:1;target.hp-=u.damage*bonus;u.attackTimer=d.interval}
}else if(baseDist<=d.range+30){if(u.attackTimer<=0){if(u.team===1)fort-=u.damage;else home-=u.damage;u.attackTimer=d.interval}}
else{u.x+=u.team*d.speed*dt;u.x=Math.max(80,Math.min(880,u.x))}}
units=units.filter(u=>u.hp>0);
if(home<=0||fort<=0){ended=true;status.textContent=fort<=0?'勝利！敵拠点を破壊した！':'敗北…編成を変えて再挑戦！'}
else if(wave>1){status.textContent='敵の攻勢 第'+wave+'波！ 相性を意識して迎撃しよう'}}
function bar(x,y,w,v,max,color){ctx.fillStyle='#253344';ctx.fillRect(x,y,w,8);ctx.fillStyle=color;ctx.fillRect(x,y,w*Math.max(0,Math.min(1,v/max)),8)}
function draw(){let sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#15243e');sky.addColorStop(1,'#47716d');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);
ctx.fillStyle='#354d5a';for(let i=0;i<8;i++){let x=i*145-40;ctx.beginPath();ctx.moveTo(x,370);ctx.lineTo(x+85,195+(i%3)*40);ctx.lineTo(x+185,370);ctx.fill()}
ctx.fillStyle='#4a6456';ctx.fillRect(0,410,960,130);ctx.fillStyle='#698368';ctx.fillRect(0,405,960,15);
function castle(x,color){ctx.fillStyle=color;ctx.fillRect(x-34,285,68,125);ctx.fillRect(x-41,275,24,35);ctx.fillRect(x+17,275,24,35);ctx.fillStyle='#d9e6df';ctx.fillRect(x-9,335,18,75);ctx.fillStyle='#142c3c';ctx.fillRect(x-7,337,14,73)}
castle(55,'#52bad6');castle(905,'#d56b78');bar(12,250,88,home,500,'#65c6e2');bar(860,250,88,fort,800,'#f0808c');
for(const u of units){const d=defs[u.type];ctx.fillStyle='rgba(0,0,0,.23)';ctx.beginPath();ctx.ellipse(u.x,405,d.radius+4,7,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(u.x,390-d.radius,d.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle=u.team===1?'#123a55':'#5a2130';ctx.fillRect(u.x+(u.team===1?4:-9),385-d.radius,5,5);
if(d.kind==='golem'){ctx.strokeStyle='#fff8';ctx.lineWidth=5;ctx.strokeRect(u.x-d.radius/2,388-d.radius,d.radius,14)}
if(d.kind==='ranger'){ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(u.x+(u.team===1?9:-9),390-d.radius,9,-1.3,1.3);ctx.stroke()}
bar(u.x-23,357-d.radius,46,u.hp,u.max,u.team===1?'#62d7aa':'#ff9b9b')}
if(ended){ctx.fillStyle='#0b1426bb';ctx.fillRect(250,165,460,150);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 48px system-ui';ctx.fillText(fort<=0?'VICTORY':'DEFEAT',480,252);ctx.textAlign='left'}
hpEl.textContent='自軍 '+Math.max(0,Math.ceil(home))+' / 500';enemyEl.textContent='敵軍 '+Math.max(0,Math.ceil(fort))+' / 800';manaEl.textContent='マナ '+Math.floor(mana)+' / 100';
document.querySelectorAll('[data-type]').forEach(b=>b.disabled=ended||mana<defs[b.dataset.type].cost||units.filter(u=>u.team===1).length>=14)}
function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop)})();
</script></html>
